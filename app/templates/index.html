<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home</title>
  <style>
    :root {
      --bg: #0b0b0d;
      --text: #f5f5f7;
      --muted: #8e8e93;
      --focus-ring: rgba(255, 255, 255, 0.9);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at top, #1c1c22 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
      cursor: default;
    }
    .screen {
      height: 100%;
      padding: 5vh 6vw;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }
    .greeting { font-size: 3vw; font-weight: 600; letter-spacing: -0.02em; }
    .sub { font-size: 1.3vw; color: var(--muted); margin-top: 0.6vh; }
    .clock { text-align: right; }
    .time { font-size: 3vw; font-weight: 300; font-variant-numeric: tabular-nums; }
    .date { font-size: 1.3vw; color: var(--muted); margin-top: 0.6vh; }

    .row-title {
      font-size: 1.4vw;
      font-weight: 600;
      color: var(--muted);
      margin: auto 0 2.5vh;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2.5vw;
      margin-bottom: 4vh;
    }
    .tile {
      aspect-ratio: 16 / 9;
      border-radius: 1.2vw;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8vw;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      box-shadow: 0 1vw 2vw rgba(0, 0, 0, 0.4);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      outline: none;
    }
    .tile:focus, .tile:hover {
      transform: scale(1.1);
      box-shadow: 0 0 0 0.25vw var(--focus-ring), 0 2vw 4vw rgba(0, 0, 0, 0.6);
      z-index: 1;
    }
    footer { font-size: 1vw; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main class="screen">
    <header>
      <div>
        <div class="greeting" id="greeting">Namaste</div>
        <div class="sub">What would you like to watch?</div>
      </div>
      <div class="clock">
        <div class="time" id="time">--:--</div>
        <div class="date" id="date">&nbsp;</div>
      </div>
    </header>

    <h2 class="row-title">Apps</h2>
    <nav class="grid" id="grid">
      {% for app in apps %}
      <a class="tile" href="{{ app.url }}" style="background: {{ app.color }}" tabindex="0">{{ app.name }}</a>
      {% endfor %}
    </nav>

    <footer>Use the arrow keys on your remote to move, and OK to open.</footer>
  </main>

  <script>
    // Clock and greeting in India Standard Time.
    var TZ = "Asia/Kolkata";
    function tick() {
      var now = new Date();
      document.getElementById("time").textContent =
        now.toLocaleTimeString("en-IN", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
      document.getElementById("date").textContent =
        now.toLocaleDateString("en-IN", { timeZone: TZ, weekday: "long", day: "numeric", month: "long" });
      var hour = parseInt(now.toLocaleString("en-GB", { timeZone: TZ, hour: "2-digit", hour12: false }), 10);
      var part = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
      document.getElementById("greeting").textContent = "Namaste · " + part;
    }
    tick();
    setInterval(tick, 15000);

    // Remote control navigation (arrow keys + OK).
    var tiles = Array.prototype.slice.call(document.querySelectorAll(".tile"));
    var COLS = 4;
    var index = 0;
    function focusTile(i) {
      if (i < 0 || i >= tiles.length) return;
      index = i;
      tiles[index].focus();
    }
    document.addEventListener("keydown", function (e) {
      var k = e.keyCode;
      if (k === 37) focusTile(index - 1);          // left
      else if (k === 39) focusTile(index + 1);     // right
      else if (k === 38) focusTile(index - COLS);  // up
      else if (k === 40) focusTile(index + COLS);  // down
      else if (k === 13) { tiles[index].click(); } // OK
      else return;
      e.preventDefault();
    });
    tiles.forEach(function (t, i) {
      t.addEventListener("mouseenter", function () { focusTile(i); }); // LG Magic Remote pointer
    });
    focusTile(0);
  </script>
</body>
</html>
